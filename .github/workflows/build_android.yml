name: Build Android App

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Gradle build variant to assemble"
        required: true
        default: debug
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write   # needed for the "Create GitHub Release" step below

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle downloads/build output between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: frontend/visor
        run: chmod +x gradlew

      - name: Assemble ${{ inputs.build_type }} APK
        working-directory: frontend/visor
        env:
          GITHUB_TOKEN: ${{ secrets.MWDAT_PACKAGES_TOKEN }}
        run: |
          TYPE="${{ inputs.build_type }}"
          ./gradlew "assemble${TYPE^}"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: visor-${{ inputs.build_type }}-${{ github.run_number }}
          path: frontend/visor/app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error

      # Optional: only meaningful for a real release build.
      - name: Create GitHub Release
        if: inputs.build_type == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VISOR v${{ github.run_number }}
          files: frontend/visor/app/build/outputs/apk/release/*.apk
