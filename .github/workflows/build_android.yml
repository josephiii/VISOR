name: Build Android App

on:
  # Every pull request that touches the app is built and unit-tested, so a
  # merge that breaks the build is caught before it reaches main.
  pull_request:
    paths:
      - "frontend/visor/**"
      - ".github/workflows/build_android.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Gradle build variant to assemble"
        required: true
        default: debug
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write   # needed for the "Create GitHub Release" step below

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pull requests have no inputs: they build debug.
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle downloads/build output between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: frontend/visor
        run: chmod +x gradlew

      # MWDAT resolves from Maven Central since 1.0.0 — no GitHub Packages token.
      - name: Assemble ${{ env.BUILD_TYPE }} APK and run unit tests
        working-directory: frontend/visor
        run: ./gradlew "assemble${BUILD_TYPE^}" testDebugUnitTest

      # Manual runs only: the APK is ~330 MB (bundled models), too big to keep per pull request.
      - name: Upload APK as build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: visor-${{ env.BUILD_TYPE }}-${{ github.run_number }}
          path: frontend/visor/app/build/outputs/apk/${{ env.BUILD_TYPE }}/*.apk
          if-no-files-found: error

      # Optional: only meaningful for a real release build.
      - name: Create GitHub Release
        if: env.BUILD_TYPE == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VISOR v${{ github.run_number }}
          files: frontend/visor/app/build/outputs/apk/release/*.apk
